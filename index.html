<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gliese: Carta Astral - Sistema de Signos Enteros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <header class="header-astral">
            <h1>Carta Astral</h1>
            <p class="subtitulo">Sistema de Signos Enteros - Swiss Ephemeris</p>
        </header>

        <div class="interfaz-columnas">
            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <section class="seccion-formulario">
                <div class="bloque-formulario">
                    <h3>Datos de Nacimiento</h3>
                    
                    <div class="campo-dato">
                        <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha-nacimiento" value="2000-01-01">
                    </div>
                    
                    <div class="campo-dato">
                        <label for="hora-nacimiento">Hora de Nacimiento (local)</label>
                        <input type="time" id="hora-nacimiento" value="12:00" step="60">
                    </div>
                    
                    <div class="campo-dato">
                        <label for="latitud">Latitud (°)</label>
                        <input type="number" id="latitud" step="0.0001" placeholder="Ej: 40.7128" value="40.7128">
                        <small style="display:block;font-size:10px;color:#888;margin-top:4px;">Norte: positivo | Sur: negativo</small>
                    </div>
                    
                    <div class="campo-dato">
                        <label for="longitud">Longitud (°)</label>
                        <input type="number" id="longitud" step="0.0001" placeholder="Ej: -74.0060" value="-74.0060">
                        <small style="display:block;font-size:10px;color:#888;margin-top:4px;">Este: positivo | Oeste: negativo</small>
                    </div>
                    
                    <div class="campo-dato">
                        <label for="zona-horaria">Zona Horaria (UTC)</label>
                        <input type="number" id="zona-horaria" step="0.5" value="-5">
                        <small style="display:block;font-size:10px;color:#888;margin-top:4px;">Ej: -5 para EST, +1 para CET</small>
                    </div>
                </div>

                <button id="btn-calcular">Calcular Carta Astral</button>
                <button id="btn-borrar">Restablecer Datos</button>
            </section>

            <!-- COLUMNA DERECHA: GRÁFICO -->
            <section class="seccion-mapa">
                <div class="contenedor-sticky-mapa">
                    <svg id="carta-astral" viewBox="0 0 600 600"></svg>
                </div>
            </section>
        </div>
    </main>

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.jsdelivr.net/npm/swe.js@2.0.0/dist/swe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
