<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Generador Astral Minimalista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor-principal">
        <header class="header-astral">
            <h1>Carta Astral</h1>
            <p class="subtitulo">Generador de Radix Personalizado</p>
        </header>

        <section class="seccion-formulario">
            <div class="input-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" value="2026-05-17">
            </div>
            <div class="input-group">
                <label for="hora">Hora</label>
                <input type="time" id="hora" value="12:00">
            </div>
            <div class="input-group" style="position: relative;">
                <label for="ciudad">Ciudad de Nacimiento</label>
                <input type="text" id="ciudad" placeholder="Ej. Caracas, Venezuela" autocomplete="off">
                <div id="sugerencias-ciudad" style="position: absolute; left: 0; top: 100%; width: 100%; max-height: 200px; overflow-y: auto; background: #ffffff; border: 1px solid #111111; z-index: 1000; display: none;"></div>
            </div>
            <button id="btn-generar">Generar Mapa</button>
        </section>

        <section class="seccion-mapa">
            <svg id="carta-astral" viewBox="0 0 600 600" width="100%" height="100%">
                <circle cx="300" cy="300" r="280" stroke="#111111" stroke-width="1" fill="none" />
                <circle cx="300" cy="300" r="5" fill="#111111" />
                <text x="300" y="40" font-family='Cormorant Garamond' font-size="18" text-anchor="middle" letter-spacing="3">M.C.</text>
            </svg>
        </section>
    </main>

    <script src="https://unpkg.com/astrology-js@1.0.3/dist/astrology.v1.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
